<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>freeWrite inline rewrite</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="mockup.css" />
<style>
	body {
		background: #161616;
		padding: 40px;
	}
	.modal-container {
		max-width: 620px;
		margin: 0 auto;
		background: var(--background-primary);
		border: 1px solid var(--background-modifier-border);
		border-radius: var(--radius-m);
		padding: var(--size-4-4);
		box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
	}
</style>
</head>
<body>
	<div class="modal-container freewrite-inline-modal">
		<h3>Rewrite selection</h3>

		<div class="freewrite-inline-original">
			<h4>Original</h4>
			<div class="freewrite-inline-text">很多人问：同一个选题，为什么在公众号能爆，在知乎却只有几十赞？

这个问题我思考了很久，答案其实不在文笔，而在「读者的问题」。公众号是订阅流，读者没有在提问；知乎是问答场，读者带着一个具体的困惑来。</div>
		</div>

		<div class="freewrite-inline-options">
			<select class="dropdown">
				<option selected>知乎</option>
				<option>微信公众号</option>
				<option>小红书</option>
				<option>今日头条</option>
			</select>
		</div>

		<div class="freewrite-inline-instructions">
			<label>Instructions (optional)</label>
			<textarea class="freewrite-inline-textarea" placeholder="For example: make it shorter and more formal.">更短一些，语气更直接，第一句给结论。</textarea>
		</div>

		<div class="freewrite-inline-preview">
			<h4>Result</h4>
			<div class="freewrite-inline-text">同一个选题，公众号能爆、知乎却只有几十赞，差别不在文笔，而在读者有没有带着问题来。

公众号是订阅流，读者不提问；知乎是问答场，读者带着困惑来。所以知乎的标题要像问题，第一段像答案。</div>
		</div>

		<div class="freewrite-inline-actions">
			<button class="freewrite-button mod-cta">Rewrite</button>
			<button class="freewrite-button">Apply</button>
			<button class="freewrite-button">Cancel</button>
		</div>
	</div>
</body>
</html>
